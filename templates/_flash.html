{% with flashed = get_flashed_messages(with_categories=true) %}
{% if flashed %}
<div role="status" aria-live="polite" style="margin:0 0 18px;">
    {% for category, text in flashed %}
        <div style="padding:12px 16px;border-radius:8px;margin-bottom:8px;font-size:14px;{% if category == 'success' %}background:#dcfce7;color:#166534;{% else %}background:#fee2e2;color:#991b1b;{% endif %}">
            {{ text }}
        </div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}
