<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | General Grievance Portal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }
        nav {
            background: #172554;
            padding: 16px 7%;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        main {
            max-width: 560px;
            margin: 70px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 36px 28px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
            text-align: center;
        }
        .code {
            font-size: 52px;
            font-weight: bold;
            color: #2563eb;
            margin: 0;
        }
        h1 { margin: 8px 0 12px; font-size: 24px; }
        p { color: #667085; line-height: 1.6; }
        a.button {
            display: inline-block;
            margin-top: 18px;
            background: #2563eb;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
<nav>General Grievance Portal</nav>
<main>
    <div class="card" role="alert">
        <p class="code">{{ code }}</p>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a class="button" href="{{ url_for('home') }}">Back to Home</a>
    </div>
</main>
</body>
</html>
